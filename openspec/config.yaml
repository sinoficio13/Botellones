# openspec/config.yaml — SDD project configuration for Botellon
# Generated by sdd-init (hybrid mode: openspec files + Engram observations)
schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router) + React 19 + TypeScript 5 (strict) + Tailwind CSS v4 + shadcn/ui (base-nova, RSC, lucide) + Supabase (@supabase/ssr + supabase-js) + Serwist PWA
  Architecture: App Router; src/app (routes/api), src/lib (db, supabase, scanner, auth, export), src/hooks, src/components; server-only is mocked in tests
  Testing: Vitest 4 (jsdom, globals, tests/setup.ts) for unit/component/integration; Playwright for e2e (tests/e2e)
  Style: ESLint 9 (eslint-config-next core-web-vitals + typescript + prettier rules), Prettier 3 via ESLint integration, @/ path alias
  Conventions: Conventional commits; read node_modules/next/dist/docs/ before writing Next.js code (this version has breaking changes); English technical artifacts

rules:
  proposal:
    - Include rollback plan for risky changes
    - Scope each proposal to one capability; reference existing specs in openspec/specs/
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Delta specs use ADDED/MODIFIED/REMOVED/RENAMED sections
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Pair each implementation task with its test task (strict TDD)
  apply:
    guidelines:
      - Follow existing code patterns (src/lib, src/app conventions)
      - Run npm run test after each task; keep the suite green
    tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  test_command: "npm run test"
  runner: vitest
  e2e: playwright
  coverage: false